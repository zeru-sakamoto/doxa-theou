[package]
name = "doxa-theou"
version = "1.9.1"
description = "Bible Study App"
authors = ["Zeru Sakamoto"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "doxa_theou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled = compile SQLite in-tree (FTS5 included), no system libsqlite dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2.7.2"
# random ids for imported notes (v4 = random, matches frontend's crypto.randomUUID()).
uuid = { version = "1", features = ["v4"] }
# HTML parsing for the Logos "Copy Bible Text" HTML export (preserves inline
# highlight spans that the plain .txt export drops). html5ever/selectors/
# tendril/cssparser are already pulled in transitively by tauri's webview, so
# this only adds the thin ego-tree wrapper on top.
scraper = "0.20"
# scraper's underlying DOM tree type — needed to name `NodeRef` explicitly
# when walking child nodes by hand (scraper doesn't re-export it).
ego-tree = "0.6"

# Lean release build for low-end devices: smaller binary + memory footprint.
# opt-level "s" (size) over "3" — this app's hot path is SQLite, not CPU math.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

